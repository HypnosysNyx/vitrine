name: Temporary upstream source snapshot
on:
  push:
    branches:
      - audit/upstream-main-20261111
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current upstream main
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/My-Name-Is-Jeff/vitrine.git
          git -C upstream fetch --depth=1 origin main
          git -C upstream archive --format=tar.gz --output=../upstream-main.tar.gz FETCH_HEAD
          git -C upstream rev-parse FETCH_HEAD > upstream-main.sha
      - uses: actions/upload-artifact@v5
        with:
          name: vitrine-upstream-main-source
          path: |
            upstream-main.tar.gz
            upstream-main.sha
          retention-days: 1
