name: Build IPA from your own Spotify IPA

on:
  # On forks, an initial branch push registers this otherwise manual-only workflow.
  # The push runs only the registration job; it never builds or uploads an IPA.
  push:
    branches: [i18n/zh-hans]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional direct IPA URL (prefer SPOTIFY_IPA_URL repository secret)"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'IPA workflow registered. Use Run workflow to build manually.'

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download and verify Spotify 9.1.90 IPA
        shell: bash
        env:
          SECRET_IPA_URL: ${{ secrets.SPOTIFY_IPA_URL }}
          FALLBACK_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          IPA_URL="${SECRET_IPA_URL:-${FALLBACK_IPA_URL:-}}"
          [ -n "$IPA_URL" ] || { echo "::error::Set SPOTIFY_IPA_URL repository secret or provide ipa_url."; exit 1; }
          case "$IPA_URL" in
            https://*) ;;
            *) echo "::error::IPA URL must start with https://"; exit 1 ;;
          esac
          echo "::add-mask::$IPA_URL"
          mkdir -p ipa
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 20 --max-time 600 "$IPA_URL" -o ipa/spotify.ipa
          python3 - <<'PY'
          import hashlib, pathlib, plistlib, sys, zipfile
          p = pathlib.Path("ipa/spotify.ipa")
          expected = "409601a58953818eea17edb92963d10256ae6fcf00c69954105e5becc08ec296"
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected:
              sys.exit("::error::IPA SHA256 differs from locally inspected Spotify 9.1.90 IPA")
          with zipfile.ZipFile(p) as z:
              plist = plistlib.loads(z.read("Payload/Spotify.app/Info.plist"))
              if plist.get("CFBundleIdentifier") != "com.spotify.client" or plist.get("CFBundleShortVersionString") != "9.1.90":
                  sys.exit("::error::IPA app ID or Spotify version is not the expected 9.1.90")
          print("Verified Spotify 9.1.90 IPA identity and SHA256")
          PY

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
