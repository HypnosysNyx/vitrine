name: Export zh-Hans audit source (temporary)

on:
  push:
    branches: [audit/zh-hans-ui-20261024]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Baseline locale tests
        run: |
          python3 scripts/sync-zh-hans.py --check
          python3 scripts/check-zh-hans-placeholders.py
          python3 scripts/check-zh-hans-coverage.py
          python3 scripts/audit-mod-ui-literals.py
      - name: Export source for thorough off-device UI audit
        uses: actions/upload-artifact@v5
        with:
          name: zh-hans-audit-source
          include-hidden-files: true
          retention-days: 1
          path: |
            tweak/Sources/
            tweak/Makefile
            localization/
            scripts/
            .github/workflows/
            CHANGELOG.md
            version.txt
