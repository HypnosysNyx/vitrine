name: Temporary beta15 zh-Hans source for localization QA
on:
  push:
    branches:
      - fix/zh-hans-beta15-ai-key-dialog-20261024
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive tracked repository sources (no IPA or secrets)
        run: git archive --format=tar.gz --output=vitrine-qa-source.tar.gz HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: vitrine-beta15-qa-source
          path: vitrine-qa-source.tar.gz
          retention-days: 1
