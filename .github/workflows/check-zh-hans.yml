# Branch-only compilation smoke check. Never injects into Spotify or creates an IPA.
# The temporary flag table is only a build-time stand-in: no Spotify IPA or secret is needed.
name: Check zh-Hans compilation (no IPA)

on:
  push:
    branches:
      - i18n/zh-hans

permissions:
  contents: read

concurrency:
  group: zh-hans-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - name: Verify zh-Hans catalog and screenshot regression coverage
        run: |
          python3 scripts/sync-zh-hans.py --check
          python3 scripts/check-zh-hans-coverage.py
          python3 scripts/check-zh-hans-placeholders.py
          python3 scripts/audit-mod-ui-literals.py

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Create temporary flag table for linking only
        shell: bash
        run: |
          cat > tweak/Sources/Shared/Flags/SGFlagList.m <<'FLAGS'
          // CI-only placeholder. Never distribute a tweak built with this file.
          #import "Flags.h"
          const SGFlagDef SGFlagTable[] = {
              {"ci-placeholder", SGFlagUnknown, 0, 0, 0},
          };
          const NSUInteger SGFlagCount = 0;
          FLAGS

      - name: Check source layer dependencies
        run: bash scripts/check-layers.sh tweak/Sources

      - name: Compile appearance and settings harnesses
        run: |
          bash harness/appearance-page/build.sh
          bash harness/mod-settings/build.sh

      - name: Compile and link tweak without packaging or IPA
        run: env -u MAKELEVEL gmake -C tweak clean all
